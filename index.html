  <style>
:root{--papel:#f9f8f2;--verde:#18352e;--texto:#20342d;--turquesa:#08a88f;--terracota:#c0532b;--cinza:#585e59;--linha:#dedfd5;--raio:24px;color:var(--texto);background:var(--papel);font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid #087969;outline-offset:4px}
button:disabled{cursor:default}
.limite{width:min(1100px,calc(100% - 48px));margin-inline:auto}
.cabecalho{border-bottom:1px solid var(--linha)}
.faixa,.rodape{display:flex;align-items:center;justify-content:space-between;gap:16px}
.faixa{min-height:83px}
.marca{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:6px 0}
.marca img{width:55px}
.marca strong,.marca small{display:block}
.marca strong{text-transform:uppercase;font-size:.93rem;font-weight:900}
.marca small,.rodape{color:var(--cinza);font-size:.85rem}
#app{padding-block:32px 42px;min-height:calc(100svh - 150px)}
.rodape{border-top:1px solid var(--linha);min-height:64px}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--raio);min-height:360px;display:flex;align-items:center;background:#18352e;color:var(--papel)}
.hero-texto{position:relative;z-index:1;padding:46px 0 48px 6%;width:56%}
.hero h1{font-size:clamp(3.5rem,8.6vw,7.2rem);line-height:.83;letter-spacing:-.085em;margin:0 0 24px;font-weight:950}
.hero h1 span{color:#79dbc8}
.hero p{font-size:clamp(1rem,1.7vw,1.17rem);line-height:1.55;max-width:24ch;margin:0;color:#e4eee8}
.hero-arte{position:absolute;inset:0 0 0 41%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 55% 51%,#326c5c 0%,transparent 62%)}
.hero-arte::before{content:"";position:absolute;width:75%;aspect-ratio:1;border:1px solid #7bc6ae44;border-radius:50%;box-shadow:0 0 0 24px #7bc6ae13,0 0 0 49px #7bc6ae0e,0 0 0 76px #7bc6ae09}
.hero-arte img{width:100%;height:105%;object-fit:contain;position:absolute;filter:drop-shadow(0 13px 14px #10211b88)}
.secao-titulo{margin:29px 0 15px;font-size:1.48rem;letter-spacing:-.04em}
.opcoes,.niveis{display:grid;gap:16px}
.opcoes{grid-template-columns:1fr 1fr}
.opcao,.nivel{border:1px solid transparent;border-radius:18px;text-align:left;transition:transform .2s,box-shadow .2s}
.opcao:hover,.nivel:hover{transform:translateY(-3px);box-shadow:0 8px 18px #18352e24}
.opcao{position:relative;display:flex;align-items:center;gap:17px;min-height:118px;padding:16px 20px;background:#d3efe7}
.opcao.laranja{background:#f4dfd3}
.icone{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:var(--verde);color:#a0eadc}
.laranja .icone{background:#8b381d;color:#ffe2c9}
.icone svg{width:28px;height:28px}
.opcao strong,.opcao small,.nivel strong,.nivel small{display:block}
.opcao strong{font-size:1.2rem;letter-spacing:-.04em}
.opcao small,.nivel small{font-size:.9rem;margin-top:4px}
.acao,.secundario{border:1px solid var(--linha);border-radius:10px;padding:10px 15px;font-weight:700;background:transparent}
.acao{background:var(--verde);color:white;border-color:var(--verde)}
.secundario:hover{background:#e8ebe1}
.titulo-jogo{margin:20px 0 5px;font-size:clamp(2.3rem,6vw,4.5rem);line-height:1;letter-spacing:-.068em}
.instrucao{margin:8px 0 20px;color:var(--cinza);line-height:1.45}
.niveis{grid-template-columns:repeat(3,1fr);margin-top:24px}
.nivel{background:#d3efe7;padding:23px;min-height:110px}
.nivel:nth-child(2){background:#ebeddd}
.nivel:nth-child(3){background:#f4dfd3}
.nivel strong{font-size:1.35rem}
.barra{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-block:16px}
.dado{display:inline-flex;align-items:center;gap:7px;background:#e9eee5;border-radius:10px;padding:10px 13px;font-variant-numeric:tabular-nums;font-size:.9rem}

.cartas{display:grid;grid-template-columns:repeat(var(--colunas),minmax(0,1fr));gap:clamp(5px,1vw,11px)}
.carta{display:block;width:100%;aspect-ratio:1;padding:0;border:0;background:none;perspective:550px}
.carta-miolo{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .38s ease}
.carta.virada .carta-miolo{transform:rotateY(180deg)}
.carta-face{position:absolute;inset:0;display:grid;place-items:center;border-radius:clamp(6px,1.2vw,14px);backface-visibility:hidden;background:var(--verde);border:1px solid #356457}
.carta:not(.virada):hover .carta-face{background:#265348}
.carta-face img{width:54%}
.carta-frente{transform:rotateY(180deg);background:#fbefe5;border-color:#d9b49e;font-size:clamp(1rem,5vw,2.55rem)}
.carta-frente{overflow:hidden}
.carta-frente .carta-arte{width:100%;height:100%;object-fit:contain}
.carta.par .carta-frente{background:#d3efe7;border-color:#6ca99a}
.puzzle-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.painel{background:#eeefe7;border:1px solid var(--linha);border-radius:17px;padding:12px;min-width:0}
.painel h2{font-size:1rem;margin:0 0 10px}
.tabuleiro{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(var(--colunas),minmax(0,1fr));grid-template-rows:repeat(var(--linhas),minmax(0,1fr));aspect-ratio:1400/990;border-radius:8px;background:#25453a;overflow:hidden}

.casa{background:none;border:1px solid #e4fff22d;padding:0;min-width:0}
.casa:hover,.casa.alvo{background:#a1e5cb55}
.casa:focus-visible{outline-offset:-3px;outline-color:#a3f5de}
.casa:disabled{border-color:transparent;pointer-events:none}
.bandeja{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.peca{position:relative;aspect-ratio:1.1;min-width:0;display:grid;place-items:center;background:#dfe5da;border:1px solid transparent;border-radius:7px;padding:2px;touch-action:none;cursor:grab}
.peca[aria-pressed="true"]{background:#b6e7db;border-color:#086d5c}
.peca[hidden]{display:none}
.peca svg,.flutuante svg,.encaixada svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.encaixada{pointer-events:none;position:absolute;z-index:1}
.flutuante{pointer-events:none;position:fixed;z-index:5;filter:drop-shadow(0 4px 6px #0008)}
.feedback{min-height:1.5em;margin:8px 0 0;font-size:.9rem;color:#5f3929}
dialog{width:min(420px,calc(100% - 34px));border:1px solid var(--linha);border-radius:var(--raio);background:var(--papel);color:var(--texto);padding:28px}
dialog::backdrop{background:#132b25b8}
dialog h2{margin:0;font-size:2rem;letter-spacing:-.055em}
dialog p{line-height:1.5}
dialog .barra{margin-bottom:0}
@media(max-width:560px){.limite{width:calc(100% - 28px)}.faixa{min-height:68px}#app{padding-block:20px 30px}.hero{min-height:430px;align-items:start}.hero-texto{padding:27px 22px;width:100%}.hero h1{margin-bottom:14px}.hero-arte{inset:40% -9% -8% 8%}.opcoes{grid-template-columns:1fr;gap:10px}.opcao{min-height:84px}.niveis{grid-template-columns:1fr;gap:9px}.nivel{min-height:0;padding:16px}.cartas{gap:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* A área de partida ocupa a janela e reserva uma faixa para a marca. */
body.em-jogo {
  min-height: 100svh;
  display: grid;
  grid-template-rows: minmax(min-content, 1fr) auto;
}
.em-jogo .cabecalho {
  grid-row: 2;
  position: sticky;
  bottom: 0;
  z-index: 2;
  background: var(--papel);
  border-top: 1px solid var(--linha);
  border-bottom: 0;
}
.em-jogo .limite { width: calc(100% - clamp(24px, 4vw, 56px)); }
.em-jogo .faixa { min-height: 52px; }
.em-jogo .marca img { width: 40px; }
.em-jogo .marca strong { font-size: .8rem; }
.em-jogo .marca small { font-size: .75rem; }
.em-jogo .rodape { display: none; }
.em-jogo #app {
  grid-row: 1;
  min-height: 0;
  display: grid;
  padding-block: 12px 8px;
}
.em-jogo .titulo-jogo {
  font-size: clamp(1.6rem, 3vw, 2.75rem);
  margin: 0;
}
.em-jogo .instrucao { margin: 5px 0 0; }
.em-jogo .barra { margin: 8px 0; }
.em-jogo #app > .secundario { justify-self: start; margin-bottom: 10px; }
.em-jogo #app:has(> .niveis) { display: block; }
.memoria, .puzzle {
  display: grid;
  min-width: 0;
  grid-template-rows: auto auto auto minmax(min-content, 1fr);
}
.memoria { grid-template-rows: auto auto auto minmax(min-content, 1fr) auto; }
.area-cartas {
  --colunas: var(--colunas-base);
  --linhas: var(--linhas-base);
  --espaco: clamp(5px, 1vw, 14px);
  container-type: size;
  min-height: 190px;
  display: grid;
  place-items: start center;
}
.area-cartas .cartas {
  --lado: min(
    calc((100cqw - (var(--colunas) - 1) * var(--espaco)) / var(--colunas)),
    calc((100cqh - (var(--linhas) - 1) * var(--espaco)) / var(--linhas))
  );
  grid-template-columns: repeat(var(--colunas), var(--lado));
  gap: var(--espaco);
}
.memoria .feedback { margin: 4px 0 0; }
.puzzle-layout {
  container-type: size;
  min-height: 250px;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
}
.tabuleiro {
  width: min(100%, calc((100cqh - 48px) * 1400 / 990));
  margin-inline: auto;
}
.puzzle .bandeja {
  width: min(100%, calc((100cqh - 94px) * 1.32));
  margin-inline: auto;
}
.puzzle .peca { aspect-ratio: 1.1; }

@media (max-width: 620px) {
  .em-jogo .barra { gap: 5px; }
  .em-jogo .barra .secundario, .em-jogo .barra .dado { padding: 7px 9px; }
  .area-cartas { min-height: calc(var(--linhas) * 40px + (var(--linhas) - 1) * var(--espaco)); }
  .area-cartas[data-nivel="2"] {
    --colunas: 4;
    --linhas: 8;
  }
  .puzzle-layout {
    container-type: normal;
    min-height: 0;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .tabuleiro, .puzzle .bandeja { width: 100%; }
  .puzzle .peca { aspect-ratio: 1.28; }
}

.escolha-cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 29px 0 15px;
}
.escolha-cabecalho .secao-titulo { margin: 0; }

function escolherNivel(ePuzzle = false) {
  const opcoes = ePuzzle ? niveisPuzzle : niveis;
  mostrar(`
    ${voltar}
    <h1 class="titulo-jogo">${ePuzzle ? tituloPuzzle : 'Jogo da memória'}</h1>
    <p class="instrucao">Escolha a dificuldade.</p>
    <div class="niveis${ePuzzle ? ' niveis-puzzle' : ''}">${opcoes.map((nivel, i) => `
      <button class="nivel" data-${ePuzzle ? 'puzzle' : 'nivel'}="${i}">
        <strong>${nivel.nome}</strong>
        <small>${ePuzzle ? `${nivel.colunas * nivel.linhas} peças` : `${nivel.pares} pares`}</small>
      </button>
    `).join('')}</div>
  `, true);
}

function vitoria(titulo, resumo, repetir) {
  tocarSom('vitoria');
  dialogo.innerHTML = `
    <h2 id="titulo-vitoria">${titulo}</h2><p>${resumo}</p>
    <div class="barra"><button class="acao" data-acao="menu" autofocus>Menu principal</button>
    <button class="secundario" id="repetir">Jogar de novo</button></div>
  `;
  dialogo.setAttribute('aria-labelledby', 'titulo-vitoria');
  dialogo.querySelector('#repetir').onclick = repetir;
  dialogo.showModal();
}

function formatarTempo(segundos) {
  return `${Math.floor(segundos / 60)}:${String(segundos % 60).padStart(2, '0')}`;
}

function jogarMemoria(indiceNivel) {
  const nivel = niveis[indiceNivel];
  const artes = artesCartas.slice(0, nivel.pares);
  const cartas = embaralhar([...artes, ...artes]);
  let primeira = null;
  let jogadas = 0;
  let pares = 0;
  let inicio;
  let relogio;
  let espera;
  mostrar(`
    <section class="memoria">
      <h1 class="titulo-jogo">Jogo da memória</h1>
      <p class="instrucao">${nivel.nome} · Vire duas cartas por vez para encontrar os pares.</p>
      <div class="barra">
        ${voltar}
        <span class="dado"><strong id="pares">0/${nivel.pares}</strong> pares</span>
        <span class="dado"><strong id="jogadas">0</strong> jogadas</span>
        <span class="dado">Tempo <strong id="tempo">0:00</strong></span>
        <button class="secundario" data-acao="niveis">Trocar dificuldade</button>
        <button class="secundario" id="reiniciar">Reiniciar</button>
      </div>
      <div class="area-cartas" data-nivel="${indiceNivel}" style="--colunas-base:${nivel.colunas};--linhas-base:${Math.ceil(cartas.length / nivel.colunas)}">
        <div class="cartas">
          ${cartas.map(([emoji, , imagem], i) => `

  const jogo = app.querySelector('.cartas');
  const tempo = app.querySelector('#tempo');
  const resultado = app.querySelector('#resultado');
  const atualizarTempo = () => {
    tempo.textContent = formatarTempo(Math.floor((Date.now() - inicio) / 1000));
  };
  limparPartida = () => {
    clearInterval(relogio);
    clearTimeout(espera);
  };
  app.querySelector('#reiniciar').onclick = () => jogarMemoria(indiceNivel);
  const botoes = Array.from(jogo.children);
  jogo.onclick = (evento) => {
    const carta = evento.target.closest('.carta');
    if (!carta || espera || carta.classList.contains('virada')) return;
    if (!inicio) {
      inicio = Date.now();
      relogio = setInterval(atualizarTempo, 250);
    }
    const i = botoes.indexOf(carta);
    tocarSom('escolha');
    carta.classList.add('virada');
    carta.setAttribute('aria-label', cartas[i][1]);
    if (!primeira) {
      primeira = { carta, i };
      resultado.textContent = '';
      return;
    }
    const combinou = cartas[i] === cartas[primeira.i];
    const dupla = [primeira, { carta, i }];
    app.querySelector('#jogadas').textContent = ++jogadas;
    espera = setTimeout(() => {
      for (const item of dupla) {
        if (combinou) {
          item.carta.classList.add('par');
          item.carta.setAttribute('aria-label', `${cartas[item.i][1]}, par encontrado`);
        } else {
          item.carta.classList.remove('virada');
          item.carta.setAttribute('aria-label', `Carta ${item.i + 1}`);
        }
      }
      tocarSom(combinou ? 'acerto' : 'erro');
      primeira = null;
      espera = null;
      resultado.textContent = combinou ? 'Par encontrado!' : 'Tente outra combinação.';
      if (combinou) app.querySelector('#pares').textContent = `${++pares}/${nivel.pares}`;
      if (pares === nivel.pares) {
        clearInterval(relogio);
        atualizarTempo();
        vitoria('Todos os pares!', `Você encontrou os ${pares} pares em ${jogadas} jogadas. Tempo de partida: ${tempo.textContent}.`, () => jogarMemoria(indiceNivel));
      }
    }, combinou ? 470 : 900);
  };
}

const tamanhoPeca = 100;
const margemPeca = 24;
const medidaSvg = tamanhoPeca + 2 * margemPeca;

// Cada borda interna é compartilhada entre duas peças, em direções opostas.
function borda(limite, indice) {
  return limite ? 0 : indice % 2 === 0 ? 1 : -1;
}

function pecaSvg(id, prefixo, { colunas, linhas }) {
  const x = id % colunas;
  const y = Math.floor(id / colunas);
  const lados = [
    [borda(y === 0, id - colunas), (t, d) => [t, d]],
    [borda(x === colunas - 1, id), (t, d) => [100 + d, t]],
    [borda(y === linhas - 1, id), (t, d) => [100 - t, 100 + d]],
    [borda(x === 0, id - 1), (t, d) => [d, 100 - t]],
  ];
  const perfil = [[0, 0], [33, 0], [41, -2], [43, 2], [39, 9], [40, 15],
    [45, 20], [50, 21], [55, 20], [60, 15], [61, 9], [57, 2], [59, -2], [67, 0], [100, 0]];
  const pontos = lados.flatMap(([sinal, ponto]) => perfil.map(([t, d]) => ponto(t, d * sinal).join(','))).join(' ');
  const clip = `${prefixo}-${id}`;

function jogarPuzzle(indiceNivel) {
  const nivel = niveisPuzzle[indiceNivel];
  const { colunas, linhas } = nivel;
  const totalPecas = colunas * linhas;
  const ids = Array.from({ length: totalPecas }, (_, i) => i);
  const repetir = () => jogarPuzzle(indiceNivel);
  let selecionada = null;
  let arraste = null;
  let colocadas = 0;
  let finalizacao;
  const ordem = embaralhar([...ids]);
  mostrar(`
    <section class="puzzle">
      <h1 class="titulo-jogo">${tituloPuzzle}</h1>
      <p class="instrucao">Arraste uma peça até o tabuleiro ou selecione a peça e depois a posição.</p>
      <div class="barra">
        ${voltar}
        <span class="dado"><strong id="progresso">0/${totalPecas}</strong> peças encaixadas</span>
        <button class="secundario" data-acao="puzzle">Trocar dificuldade</button>
        <button class="secundario" id="guia" aria-pressed="true">Ocultar imagem-guia</button>
        <button class="secundario" id="reiniciar">Reiniciar</button>
      </div>
      <div class="puzzle-layout">
        <section class="painel" aria-labelledby="montagem">
          <h2 id="montagem">Tabuleiro</h2>
          <div class="tabuleiro guia" style="--colunas:${colunas};--linhas:${linhas}">
            ${ids.map(i => `<button class="casa" data-casa="${i}" aria-label="Linha ${Math.floor(i / colunas) + 1}, coluna ${i % colunas + 1}"></button>`).join('')}
          </div>
        </section>
        <section class="painel" aria-labelledby="pecas">
          <h2 id="pecas">Peças embaralhadas</h2>
          <div class="bandeja">
            ${ordem.map((id, i) => `<button class="peca" data-peca="${id}" aria-label="Peça ${i + 1}" aria-pressed="false">${pecaSvg(id, 'bandeja', nivel)}</button>`).join('')}
          </div>
          <p class="feedback" role="status" id="resultado"></p>
        </section>
      </div>
    </section>
  `, true);
  const tabuleiro = app.querySelector('.tabuleiro');
  const bandeja = app.querySelector('.bandeja');
  const resultado = app.querySelector('#resultado');
  const guia = app.querySelector('#guia');
  const progresso = app.querySelector('#progresso');
  const movimentoReduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function selecionar(botao) {
    selecionada?.setAttribute('aria-pressed', 'false');
    if (botao && botao !== selecionada) tocarSom('escolha');
    selecionada = botao;
    selecionada?.setAttribute('aria-pressed', 'true');
    resultado.textContent = botao ? 'Peça selecionada. Escolha a posição no tabuleiro.' : '';
  }

  function encaixar(casa, origem) {
    if (!selecionada || !casa || casa.disabled) return;
    const id = Number(selecionada.dataset.peca);
    if (id !== Number(casa.dataset.casa)) {
      tocarSom('erro');
      resultado.textContent = 'Essa peça encaixa em outra posição.';
      return;
    }
    const caixaOrigem = origem || selecionada.querySelector('svg').getBoundingClientRect();
    const peca = document.createElement('div');
    peca.className = 'encaixada';
    peca.style.width = `${medidaSvg / colunas}%`;
    peca.style.height = `${medidaSvg / linhas}%`;
    peca.style.left = `${(id % colunas * tamanhoPeca - margemPeca) / colunas}%`;
    peca.style.top = `${(Math.floor(id / colunas) * tamanhoPeca - margemPeca) / linhas}%`;
    peca.innerHTML = pecaSvg(id, 'tabuleiro', nivel);
    tabuleiro.append(peca);
    casa.disabled = true;
    selecionada.hidden = true;
    selecionar(null);
    // Anima uma cópia fora do tabuleiro para permitir a transição entre os painéis.
    if (!movimentoReduzido) {
      const destino = peca.getBoundingClientRect();
      const copia = document.createElement('div');
      copia.className = 'flutuante';
      copia.innerHTML = pecaSvg(id, 'encaixe', nivel);
      Object.assign(copia.style, {
        left: `${destino.left}px`, top: `${destino.top}px`,
        width: `${destino.width}px`, height: `${destino.height}px`,
      });
      document.body.append(copia);
      peca.style.visibility = 'hidden';
      const animacao = copia.animate([
        { transformOrigin: 'top left', transform: `translate(${caixaOrigem.left - destino.left}px, ${caixaOrigem.top - destino.top}px) scale(${caixaOrigem.width / destino.width}, ${caixaOrigem.height / destino.height})` },
        { transformOrigin: 'top left', transform: 'none' },
      ], { duration: 240, easing: 'cubic-bezier(.2,.72,.25,1)' });
      animacao.onfinish = () => {
        peca.style.visibility = '';
        copia.remove();
      };
    }
    progresso.textContent = `${++colocadas}/${totalPecas}`;
    tocarSom('acerto');
    resultado.textContent = 'Peça encaixada!';
    const proxima = bandeja.querySelector('.peca:not([hidden])');
    proxima?.focus({ preventScroll: true });
    if (colocadas === totalPecas) {
      finalizacao = setTimeout(() => {
        vitoria('Imagem completa!', `Você encaixou as ${totalPecas} peças do Igaru.`, repetir);
      }, movimentoReduzido ? 0 : 260);
    }
  }

  function casaNaPosicao(evento) {
    return document.elementFromPoint(evento.clientX, evento.clientY)?.closest('.casa:not(:disabled)');
  }

  function moverCopia(evento) {
    const { copia, largura, altura } = arraste;
    copia.style.left = `${evento.clientX - largura / 2}px`;
    copia.style.top = `${evento.clientY - altura / 2}px`;
    arraste.alvo?.classList.remove('alvo');
    arraste.alvo = casaNaPosicao(evento);
    arraste.alvo?.classList.add('alvo');
  }

  bandeja.onpointerdown = (evento) => {
    const botao = evento.target.closest('.peca');
    if (!botao || evento.button !== 0 || arraste) return;
    arraste = { botao, x: evento.clientX, y: evento.clientY, ponteiro: evento.pointerId };
    botao.setPointerCapture(evento.pointerId);
  };
  bandeja.onpointermove = (evento) => {
    if (arraste?.ponteiro !== evento.pointerId) return;
    if (!arraste.copia) {
      if (Math.hypot(evento.clientX - arraste.x, evento.clientY - arraste.y) < 7) return;
      selecionar(arraste.botao);
      const casa = tabuleiro.firstElementChild.getBoundingClientRect();
      const copia = document.createElement('div');
      copia.className = 'flutuante';
      copia.innerHTML = pecaSvg(Number(arraste.botao.dataset.peca), 'arraste', nivel);
      arraste.largura = casa.width * medidaSvg / tamanhoPeca;
      arraste.altura = casa.height * medidaSvg / tamanhoPeca;
      copia.style.width = `${arraste.largura}px`;
      copia.style.height = `${arraste.altura}px`;
      document.body.append(copia);
      arraste.copia = copia;
    }
    moverCopia(evento);
  };

  function terminarArraste(evento, soltar) {
    if (arraste?.ponteiro !== evento.pointerId) return;
    const anterior = arraste;
    arraste = null;
    anterior.alvo?.classList.remove('alvo');
    if (!anterior.copia) return;
    if (soltar) encaixar(casaNaPosicao(evento), anterior.copia.getBoundingClientRect());
    anterior.copia.remove();
  }

  bandeja.onpointerup = (evento) => terminarArraste(evento, true);
  bandeja.onpointercancel = (evento) => terminarArraste(evento, false);
  bandeja.onclick = (evento) => {
    const botao = evento.target.closest('.peca');
    if (botao && !botao.hidden) selecionar(botao);
  };
  tabuleiro.onclick = (evento) => {
    const casa = evento.target.closest('.casa');
    if (casa && !selecionada) resultado.textContent = 'Escolha uma peça primeiro.';
    encaixar(casa);
  };
  guia.onclick = () => {
    const ativa = tabuleiro.classList.toggle('guia');
    guia.setAttribute('aria-pressed', String(ativa));
    guia.textContent = ativa ? 'Ocultar imagem-guia' : 'Mostrar imagem-guia';
  };
  app.querySelector('#reiniciar').onclick = repetir;
  limparPartida = () => {
    clearTimeout(finalizacao);
    document.querySelectorAll('.flutuante').forEach(copia => copia.remove());
  };
}

// Tons sintetizados para funcionar também no HTML offline da exposição.
const sons = {
  foco: { notas: [520], duracao: .045, volume: .025 },
  escolha: { notas: [370, 555], duracao: .06, volume: .07 },
  acerto: { notas: [660, 880], duracao: .1, volume: .09 },
  erro: { notas: [294, 196], duracao: .11, volume: .08 },
  vitoria: { notas: [523, 659, 784, 1047], duracao: .17, volume: .10 },
};
let audio;

async function tocarSom(efeito) {
  try {
    const Contexto = window.AudioContext || window.webkitAudioContext;
    if (!Contexto || (efeito === 'foco' && audio?.state !== 'running')) return;
    audio ??= new Contexto();
    if (audio.state !== 'running') await audio.resume();
    const { notas, duracao, volume } = sons[efeito];
    const inicio = audio.currentTime + (efeito === 'vitoria' ? .18 : 0);
    notas.forEach((frequencia, i) => {
      const tempo = inicio + i * duracao;
      const tom = audio.createOscillator();
      const ganho = audio.createGain();
      tom.type = efeito === 'erro' ? 'triangle' : 'sine';
      tom.frequency.value = frequencia;
      ganho.gain.setValueAtTime(.001, tempo);
      ganho.gain.exponentialRampToValueAtTime(volume, tempo + .01);
      ganho.gain.exponentialRampToValueAtTime(.001, tempo + duracao);
      tom.connect(ganho).connect(audio.destination);
      tom.start(tempo);
      tom.stop(tempo + duracao);
    });
  } catch {
    // A indisponibilidade de áudio não deve interromper a partida.
  }
}

app.addEventListener('pointerover', (evento) => {
  const item = evento.target.closest('.carta:not(.virada), .peca:not([hidden])');
  if (evento.pointerType === 'mouse' && item && !item.contains(evento.relatedTarget)) {
    tocarSom('foco');
  }
});

async function alternarTelaCheia(mostrarAviso = false) {
  tentouTelaCheia = true;
  if (!document.fullscreenEnabled) return;
  const aviso = app.querySelector('#aviso-tela-cheia');
  if (aviso) aviso.hidden = true;
  try {
    if (document.fullscreenElement) {
      if (mostrarAviso) await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch {
    if (mostrarAviso && aviso) {
      aviso.textContent = 'O navegador não conseguiu mudar o modo de tela cheia.';
      aviso.hidden = false;
    }
  }
}

document.addEventListener('fullscreenchange', () => {
  const botao = app.querySelector('[data-acao="tela-cheia"]');
  if (botao) botao.textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
});

document.addEventListener('click', (evento) => {
  const botao = evento.target.closest('button');
  if (!botao) return;
  const acao = botao.dataset.acao;
  if (acao === 'tela-cheia') {
    alternarTelaCheia(true);
    return;
  }
  const escolhaInicial = botao.classList.contains('opcao');
  if (escolhaInicial && !tentouTelaCheia && /^https?:$/.test(location.protocol)) {
    alternarTelaCheia();
  }
  const acoes = { menu, niveis: () => escolherNivel(), puzzle: () => escolherNivel(true) };
  acoes[botao.dataset.acao]?.();
  if ('nivel' in botao.dataset || 'puzzle' in botao.dataset) {
    tocarSom('escolha');
    if ('puzzle' in botao.dataset) jogarPuzzle(Number(botao.dataset.puzzle));
    else jogarMemoria(Number(botao.dataset.nivel));
  }
});

menu();
