  <style>
:root{--papel:#f9f8f2;--verde:#18352e;--texto:#20342d;--turquesa:#08a88f;--terracota:#c0532b;--cinza:#585e59;--linha:#dedfd5;--raio:24px;color:var(--texto);background:var(--papel);font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid #087969;outline-offset:4px}
button:disabled{cursor:default}
.limite{width:min(1100px,calc(100% - 48px));margin-inline:auto}
.cabecalho{border-bottom:1px solid var(--linha)}
.faixa{display:flex;align-items:center;justify-content:space-between;gap:16px}
.faixa{min-height:83px}
.marca{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:6px 0}
.marca img{width:55px}
.marca strong,.marca small{display:block}
.marca strong{text-transform:uppercase;font-size:.93rem;font-weight:900}
.marca small{color:var(--cinza);font-size:.85rem}
#app{padding-block:32px 42px;min-height:calc(100svh - 84px)}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--raio);min-height:360px;display:flex;align-items:center;background:#18352e;color:var(--papel)}
.hero-texto{position:relative;z-index:1;padding:46px 0 48px 6%;width:56%}
.hero h1{font-size:clamp(3.5rem,8.6vw,7.2rem);line-height:.83;letter-spacing:-.085em;margin:0 0 24px;font-weight:950}
.hero h1:focus{outline:none}
.hero h1 span{color:#79dbc8}
.hero p{font-size:clamp(1rem,1.7vw,1.17rem);line-height:1.55;max-width:24ch;margin:0;color:#e4eee8}
.hero-arte{position:absolute;inset:0 0 0 41%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 55% 51%,#326c5c 0%,transparent 62%)}
.hero-arte::before{content:"";position:absolute;width:75%;aspect-ratio:1;border:1px solid #7bc6ae44;border-radius:50%;box-shadow:0 0 0 24px #7bc6ae13,0 0 0 49px #7bc6ae0e,0 0 0 76px #7bc6ae09}
.hero-arte img{width:100%;height:105%;object-fit:contain;position:absolute;filter:drop-shadow(0 13px 14px #10211b88)}
.secao-titulo{margin:29px 0 15px;font-size:1.48rem;letter-spacing:-.04em}
.opcoes,.niveis{display:grid;gap:16px}
.opcoes{grid-template-columns:1fr 1fr}
.opcao,.nivel{border:1px solid transparent;border-radius:18px;text-align:left;transition:transform .2s,box-shadow .2s}
.opcao:hover,.nivel:hover{transform:translateY(-3px);box-shadow:0 8px 18px #18352e24}
.opcao{position:relative;display:flex;align-items:center;gap:17px;min-height:118px;padding:16px 20px;background:#d3efe7}
.opcao.laranja{background:#f4dfd3}
.icone{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:var(--verde);color:#a0eadc}
.laranja .icone{background:#8b381d;color:#ffe2c9}
.icone svg{width:28px;height:28px}
.opcao strong,.opcao small,.nivel strong,.nivel small{display:block}
.opcao strong{font-size:1.2rem;letter-spacing:-.04em}
.opcao small,.nivel small{font-size:.9rem;margin-top:4px}
.acao,.secundario{border:1px solid var(--linha);border-radius:10px;padding:10px 15px;font-weight:700;background:transparent}
.acao{background:var(--verde);color:white;border-color:var(--verde)}
.secundario:hover{background:#e8ebe1}
.titulo-jogo{margin:20px 0 5px;font-size:clamp(2.3rem,6vw,4.5rem);line-height:1;letter-spacing:-.068em}
.instrucao{margin:8px 0 20px;color:var(--cinza);line-height:1.45}
.niveis{grid-template-columns:repeat(3,1fr);margin-top:24px}
.nivel{background:#d3efe7;padding:23px;min-height:110px}
.nivel:nth-child(2){background:#ebeddd}
.nivel:nth-child(3){background:#f4dfd3}
.nivel strong{font-size:1.35rem}
.barra{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-block:16px}
.dado{display:inline-flex;align-items:center;gap:7px;background:#e9eee5;border-radius:10px;padding:10px 13px;font-variant-numeric:tabular-nums;font-size:.9rem}

.carta{display:block;width:100%;aspect-ratio:1;padding:0;border:0;background:none;perspective:550px}
.carta-miolo{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .38s ease}
.carta.virada .carta-miolo{transform:rotateY(180deg)}
.carta-face{position:absolute;inset:0;display:grid;place-items:center;border-radius:clamp(6px,1.2vw,14px);backface-visibility:hidden;background:var(--verde);border:1px solid #356457}
.carta:not(.virada):hover .carta-face{background:#265348}
.carta-face img{width:54%}
.carta-frente{transform:rotateY(180deg);background:#fbefe5;border-color:#d9b49e;font-size:clamp(1rem,5vw,2.55rem)}
.carta-frente{overflow:hidden}
.carta-frente .carta-arte{width:100%;height:100%;object-fit:contain}
.carta.par .carta-frente{background:#d3efe7;border-color:#6ca99a}
.puzzle-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.painel{background:#eeefe7;border:1px solid var(--linha);border-radius:17px;padding:12px;min-width:0}
.painel h2{font-size:1rem;margin:0 0 10px}
.tabuleiro{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(var(--colunas),minmax(0,1fr));grid-template-rows:repeat(var(--linhas),minmax(0,1fr));aspect-ratio:1400/990;border-radius:8px;background:#25453a;overflow:hidden}
.tabuleiro.guia{background:linear-gradient(#17362d88,#17362d88),var(--imagem-puzzle) center/100% 100%}
.casa{background:none;border:1px solid #e4fff22d;padding:0;min-width:0}
.casa:hover,.casa.alvo{background:#a1e5cb55}
.casa:focus-visible{outline-offset:-3px;outline-color:#a3f5de}
.casa:disabled{border-color:transparent;pointer-events:none}
.bandeja{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(5px, 1vw, 12px)}
.peca{position:relative;aspect-ratio:1.1;min-width:0;display:grid;place-items:center;background:#dfe5da;border:1px solid transparent;border-radius:7px;padding:2px;touch-action:none;cursor:grab}
.peca[aria-pressed="true"]{background:#b6e7db;border-color:#086d5c}
.peca[hidden]{display:none}
.peca svg,.flutuante svg,.encaixada svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.encaixada{pointer-events:none;position:absolute;z-index:1}
.flutuante{pointer-events:none;position:fixed;z-index:5;filter:drop-shadow(0 4px 6px #0008)}
.feedback{min-height:1.5em;margin:8px 0 0;font-size:.9rem;color:#5f3929}
dialog{width:min(420px,calc(100% - 34px));border:1px solid var(--linha);border-radius:var(--raio);background:var(--papel);color:var(--texto);padding:28px}
dialog::backdrop{background:#132b25b8}
dialog h2{margin:0;font-size:2rem;letter-spacing:-.055em}
dialog p{line-height:1.5}
dialog .barra{margin-bottom:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* As partidas usam a janela inteira, com os controles no topo. */
body.em-jogo {
  min-height: 100svh;
  display: grid;
}
.em-jogo .cabecalho { display: none; }
.em-jogo .limite { width: calc(100% - clamp(24px, 4vw, 56px)); }
.em-jogo #app {
  grid-row: 1;
  min-height: 0;
  display: grid;
  padding-block: 12px 8px;
}
.em-jogo .titulo-jogo {
  font-size: clamp(1.6rem, 3vw, 2.75rem);
  margin: 0;
}
.em-jogo .instrucao { margin: 5px 0 0; }
.em-jogo .barra { margin: 8px 0; }
.em-jogo #app > .secundario { justify-self: start; margin-bottom: 10px; }
.em-jogo #app:has(> .niveis) { display: block; }
.memoria, .puzzle {
  display: grid;
  min-width: 0;
  grid-template-rows: auto minmax(min-content, 1fr);
}
.memoria { grid-template-rows: auto minmax(min-content, 1fr) auto; }
.area-cartas {
  container-type: size;
  min-height: 190px;
  display: grid;
  place-items: center;
}
.cartas {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(6px, 1.35vw, 18px);
  width: var(--largura-grade, 100%);
}
.cartas .carta {
  width: var(--lado-carta, calc(85% / var(--colunas-base)));
}
.memoria .feedback { margin: 4px 0 0; }
.puzzle-layout {
  container-type: size;
  min-height: 250px;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
}
.tabuleiro {
  width: min(100%, calc((100cqh - 48px) * 1400 / 990));
  margin-inline: auto;
}
.puzzle .bandeja {
  width: min(100%, calc((100cqh - 104px) * 1.32));
  margin-inline: auto;
}
.puzzle .peca { aspect-ratio: 1.1; }

@media (min-width: 621px) and (max-width: 1180px) and (orientation: portrait) {
  .em-jogo #app { padding-block: 18px; }
  .memoria .barra { gap: 10px; margin-block: 0 14px; }

}

@media (621px <= width <= 1180px), (621px <= width <= 1366px) and (pointer: coarse) {
  .puzzle-layout {
    container-type: normal;
    grid-template-columns: minmax(0, 1fr);
    align-content: start;
    justify-self: center;
    width: min(100%, 920px);
    gap: 12px;
  }
  .puzzle .tabuleiro, .puzzle .bandeja { width: 100%; }
  .puzzle .peca { aspect-ratio: 1.28; }
}

@media (max-width: 620px) {
  .em-jogo .barra { gap: 5px; }
  .em-jogo .barra .secundario, .em-jogo .barra .dado { padding: 7px 9px; }
  .puzzle-layout {
    container-type: normal;
    min-height: 0;
    grid-template-columns: minmax(0, 1fr);
    align-content: start;
    gap: 8px;
  }
  .tabuleiro, .puzzle .bandeja { width: 100%; }
  .puzzle .peca { aspect-ratio: 1.28; touch-action: manipulation; }
  .puzzle .painel { padding: 8px; }
}

.escolha-cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 29px 0 15px;
}
.escolha-cabecalho .secao-titulo { margin: 0; }

  position: relative;
  min-height: 100svh;
}

/* Em tablets, a coluna de arte divide o destaque com o texto. */
@media (max-width: 1024px) {
  .hero { min-height: clamp(270px, 36vw, 360px); }
  .hero-texto { padding-block: 30px; }
  .hero h1 { font-size: clamp(3.5rem, 9vw, 5.75rem); }
  .hero-arte img { height: 96%; }
  .opcao { min-height: 96px; padding: 14px 16px; }
}

@media (min-width: 601px) {
  .niveis-puzzle { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 600px) {
  .limite { width: calc(100% - 28px); }
  .faixa { min-height: 62px; }
  #app { padding-block: 14px 24px; min-height: calc(100svh - 63px); }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 0;
  }
  .hero-texto {
    width: 100%;
    padding: 20px 14px 6px;
    text-align: center;
  }
  .hero h1 {
    font-size: clamp(2.7rem, 12.5vw, 4.5rem);
    line-height: .9;
    letter-spacing: -.065em;
    margin-bottom: 10px;
  }
  .hero p { display: none; }
  .hero-arte {
    position: relative;
    inset: auto;
    height: clamp(155px, 48vw, 255px);
    overflow: visible;
    background: radial-gradient(ellipse at center, #326c5c 0%, transparent 68%);
  }
  .hero-arte::before {
    width: min(65%, clamp(144px, 46vw, 242px));
    box-shadow: 0 0 0 10px #7bc6ae16, 0 0 0 21px #7bc6ae10, 0 0 0 33px #7bc6ae09;
  }
  .hero-arte img {
    width: 100%;
    height: 94%;
    translate: -2% 0;
  }
  .escolha-cabecalho { margin: 17px 0 10px; }
  .escolha-cabecalho .secao-titulo { font-size: 1.3rem; }
  .opcoes, .niveis { grid-template-columns: minmax(0, 1fr); gap: 9px; }
  .opcao { min-height: 68px; gap: 12px; padding: 10px 13px; }
  .opcao strong { font-size: 1.08rem; }
  .icone { width: 42px; height: 42px; border-radius: 11px; }
  .icone svg { width: 24px; height: 24px; }
  .nivel { min-height: 0; padding: 14px 16px; }
}

.botao-icone {
  display: inline-grid;
  place-items: center;
  min-width: 44px;
  min-height: 44px;
  padding: 8px;
}
.botao-icone svg, .dado-icone svg { width: 22px; height: 22px; }
.botao-icone[aria-pressed="true"] {
  background: #d3efe7;
  border-color: #6ca99a;
}

  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;

:is(.memoria, .puzzle) .barra {
  --fundo-controle: #e9eee5;
}
:is(.memoria, .puzzle) .barra :is(.dado-icone, .botao-icone) {
  min-height: 44px;
  background: var(--fundo-controle);
  border: 1px solid transparent;
  border-radius: 10px;
}
:is(.memoria, .puzzle) .barra .dado-icone { padding-block: 8px; }
:is(.memoria, .puzzle) .barra .botao-icone:hover { background: #dce6da; }

.puzzle .barra .botao-icone[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1px #639b8e;
}

.letra-icone { font-size: 1.65rem; font-weight: 850; }

.jogo-palavras {
  width: min(100%, 1050px);
  margin-inline: auto;
  align-self: start;
}
.jogo-palavras > .instrucao {
  margin-block: 8px 14px;
  font-size: clamp(1.125rem, 2.5vw, 1.65rem);
  font-weight: 600;
}
.jogo-palavras .barra .botao-icone {
  background: #e9eee5;
  border-color: transparent;
}
.jogo-palavras .barra .botao-icone:hover { background: #dce6da; }
.caca-layout {
  display: grid;
  align-items: start;
  grid-template-columns: minmax(0, 1fr) clamp(175px, 20vw, 235px);
  gap: clamp(10px, 2vw, 24px);
}
.caca-grade {
  display: grid;
  grid-template-columns: repeat(var(--colunas-caca), minmax(0, 1fr));
  gap: clamp(3px, 1vw, 8px);
  padding: clamp(6px, 1.5vw, 14px);
}
.letra {
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 40px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: var(--papel);
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  font-weight: 800;
}
.letra:hover { border-color: #6ca99a; }
.caca-grade .letra { aspect-ratio: 1; min-height: 0; }
.letra[aria-pressed="true"] { background: var(--verde); color: var(--papel); }
.letra-encontrada { background: #c4e7dd; }
.lista-palavras { list-style: none; padding: 0; margin: 0; }
.lista-palavras li { padding-block: 8px; }
.lista-palavras li + li { border-top: 1px solid var(--linha); }
.lista-palavras strong { position: relative; display: inline-block; }
.palavra-encontrada strong::after {
  content: "";
  position: absolute;
  left: -2%;
  right: -2%;
  top: 53%;
  border-top: 2px solid var(--terracota);
  transform-origin: left center;
  animation: riscar-palavra .23s linear both;
}
@keyframes riscar-palavra { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.forca { max-width: 780px; }
.forca .painel + .painel { margin-top: 10px; }
.forca-resposta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: clamp(3px, 1vw, 10px);
  margin-block: 18px 8px;
}
.forca-resposta span {
  width: clamp(21px, 6vw, 46px);
  min-height: 1.4em;
  border-bottom: 2px solid var(--turquesa);
  text-align: center;
  font-size: clamp(1.15rem, 4vw, 2.1rem);
  font-weight: 800;
}
.forca-teclado { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; }
.forca-escolhidas { display: flex; flex-wrap: wrap; gap: 5px; min-height: 32px; margin: 0; padding: 0; list-style: none; }
.forca-escolhidas li { display: grid; place-items: center; min-width: 32px; min-height: 32px; border: 1px solid var(--linha); border-radius: 7px; font-weight: 800; }

@media (max-width: 680px) {
  .caca-layout { grid-template-columns: minmax(0, 1fr); }
  .caca-grade { width: min(100%, 480px); justify-self: center; }
  .forca-teclado { grid-template-columns: repeat(7, minmax(0, 1fr)); }
}

.forca-desenho {
  display: block;
  height: clamp(72px, 14vh, 116px);
  margin: 8px auto 0;
  color: var(--verde);
}

@media (621px <= width <= 1180px) and (orientation: portrait) {

  .forca-teclado { grid-template-columns: repeat(7, minmax(0, 1fr)); }

    [itens[i], itens[j]] = [itens[j], itens[i]];
  }
  return itens;
}

function mostrar(conteudo, emJogo = false) {
  limparPartida();
  limparPartida = () => {};
  if (dialogo.open) dialogo.close();
  document.body.classList.toggle('em-jogo', emJogo);
  app.innerHTML = conteudo;
  const titulo = app.querySelector('h1, .memoria, .puzzle, .jogo-palavras');
  titulo.tabIndex = -1;
  titulo.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

// Usa a mesma faixa de tela em que o quebra-cabeças adota o layout de tablet.
const telaTablet = matchMedia('(621px <= width <= 1180px), (621px <= width <= 1366px) and (pointer: coarse)');

function paresDeMemoria(nivel) {
  return telaTablet.matches && nivel.paresTablet ? nivel.paresTablet : nivel.pares;
}

telaTablet.addEventListener('change', () => {
  app.querySelectorAll('[data-nivel]').forEach(botao => {
    botao.querySelector('small').textContent = `${paresDeMemoria(niveis[botao.dataset.nivel])} pares`;
  });
});

function escolherNivel(ePuzzle = false) {
  const opcoes = ePuzzle ? niveisPuzzle : niveis;
  mostrar(`
    ${voltar}
    <h1 class="titulo-jogo">${ePuzzle ? tituloPuzzle : 'Jogo da memória'}</h1>
    <p class="instrucao">Escolha a dificuldade.</p>
    <div class="niveis${ePuzzle ? ' niveis-puzzle' : ''}">${opcoes.map((nivel, i) => `
      <button class="nivel" data-${ePuzzle ? 'puzzle' : 'nivel'}="${i}">
        <strong>${nivel.nome}</strong>
        <small>${ePuzzle ? `${nivel.colunas * nivel.linhas} peças` : `${paresDeMemoria(nivel)} pares`}</small>
      </button>
    `).join('')}</div>
  `, true);
}

function vitoria(titulo, resumo, repetir, venceu = true) {
  if (venceu) tocarSom('vitoria');
  dialogo.innerHTML = `
    <h2 id="titulo-vitoria">${titulo}</h2><p>${resumo}</p>
    <div class="barra">${voltar}
    <button class="secundario botao-icone" id="repetir" aria-label="Jogar de novo" title="Jogar de novo">${reiniciarIcone}</button></div>
  `;
  dialogo.setAttribute('aria-labelledby', 'titulo-vitoria');
  dialogo.querySelector('#repetir').onclick = repetir;
  dialogo.showModal();
}

function formatarTempo(segundos) {
  return `${Math.floor(segundos / 60)}:${String(segundos % 60).padStart(2, '0')}`;
}

function medirGrade(total, largura, altura, espaco) {
  let melhor = { colunas: 2, lado: 0 };
  for (let colunas = 2; colunas <= Math.ceil(total / 2); colunas++) {
    const linhas = Math.ceil(total / colunas);
    const lado = Math.floor(Math.min(
      (largura - (colunas - 1) * espaco) / colunas,
      (altura - (linhas - 1) * espaco) / linhas,
    ));
    if (lado > melhor.lado) melhor = { colunas, lado };
  }
  return melhor;
}

function jogarMemoria(indiceNivel) {
  const nivel = niveis[indiceNivel];
  const totalPares = paresDeMemoria(nivel);
  const artes = artesCartas.slice(0, totalPares);
  const cartas = embaralhar([...artes, ...artes]);
  let primeira = null;
  let jogadas = 0;
  let pares = 0;
  let inicio;
  let relogio;
  let espera;
  mostrar(`
    <section class="memoria" aria-label="Jogo da memória, nível ${nivel.nome}">
      <div class="barra">
        ${voltar}
        <span class="dado dado-icone" title="Pares encontrados"><span class="rotulo-progresso">Pares encontrados</span>${paresIcone}<strong id="pares">0/${totalPares}</strong></span>
        <span class="dado dado-icone" title="Tempo de partida"><span class="rotulo-progresso">Tempo de partida</span>${cronometroIcone}<strong id="tempo">0:00</strong></span>
        ${reiniciar}
      </div>
      <div class="area-cartas" style="--colunas-base:${nivel.colunas}">
        <div class="cartas">
          ${cartas.map(([emoji, , imagem], i) => `

    const espaco = parseFloat(getComputedStyle(jogo).columnGap);
    const { colunas, lado } = medirGrade(cartas.length, area.clientWidth, area.clientHeight, espaco);
    if (lado <= 0) return;
    jogo.style.setProperty('--largura-grade', `${colunas * lado + (colunas - 1) * espaco}px`);
    jogo.style.setProperty('--lado-carta', `${lado}px`);
  };
  const observador = new ResizeObserver(dimensionar);
  dimensionar();
  observador.observe(area);

  const resultado = app.querySelector('#resultado');

    tempo.textContent = formatarTempo(Math.floor((Date.now() - inicio) / 1000));
  };
  limparPartida = () => {
    observador.disconnect();
    clearInterval(relogio);
    clearTimeout(espera);
  };
  app.querySelector('#reiniciar').onclick = () => jogarMemoria(indiceNivel);
  const botoes = Array.from(jogo.children);
  jogo.onclick = (evento) => {
    const carta = evento.target.closest('.carta');
    if (!carta || espera || carta.classList.contains('virada')) return;
    if (!inicio) {
      inicio = Date.now();
      relogio = setInterval(atualizarTempo, 250);
    }
    const i = botoes.indexOf(carta);
    tocarSom('escolha');
    carta.classList.add('virada');
    carta.setAttribute('aria-label', cartas[i][1]);
    if (!primeira) {
      primeira = { carta, i };
      resultado.textContent = '';
      return;
    }
    const combinou = cartas[i] === cartas[primeira.i];
    const dupla = [primeira, { carta, i }];
    jogadas++;
    espera = setTimeout(() => {
      for (const item of dupla) {
        if (combinou) {
          item.carta.classList.add('par');
          item.carta.setAttribute('aria-label', `${cartas[item.i][1]}, par encontrado`);
        } else {
          item.carta.classList.remove('virada');
          item.carta.setAttribute('aria-label', `Carta ${item.i + 1}`);
        }
      }
      tocarSom(combinou ? 'acerto' : 'erro');
      primeira = null;
      espera = null;
      resultado.textContent = combinou ? 'Par encontrado!' : 'Tente outra combinação.';
      if (combinou) app.querySelector('#pares').textContent = `${++pares}/${totalPares}`;
      if (pares === totalPares) {
        clearInterval(relogio);
        atualizarTempo();
        vitoria('Todos os pares!', `Você encontrou os ${pares} pares em ${jogadas} jogadas. Tempo de partida: ${tempo.textContent}.`, () => jogarMemoria(indiceNivel));
      }
    }, combinou ? 470 : 900);
  };
}

const tamanhoPeca = 100;
const margemPeca = 24;
const medidaSvg = tamanhoPeca + 2 * margemPeca;

// Cada borda interna é compartilhada entre duas peças, em direções opostas.
function borda(limite, indice) {
  return limite ? 0 : indice % 2 === 0 ? 1 : -1;
}

function pecaSvg(id, prefixo, { colunas, linhas }, imagem) {
  const x = id % colunas;
  const y = Math.floor(id / colunas);
  const lados = [
    [borda(y === 0, id - colunas), (t, d) => [t, d]],
    [borda(x === colunas - 1, id), (t, d) => [100 + d, t]],
    [borda(y === linhas - 1, id), (t, d) => [100 - t, 100 + d]],
    [borda(x === 0, id - 1), (t, d) => [d, 100 - t]],
  ];
  const perfil = [[0, 0], [33, 0], [41, -2], [43, 2], [39, 9], [40, 15],
    [45, 20], [50, 21], [55, 20], [60, 15], [61, 9], [57, 2], [59, -2], [67, 0], [100, 0]];
  const pontos = lados.flatMap(([sinal, ponto]) => perfil.map(([t, d]) => ponto(t, d * sinal).join(','))).join(' ');
  const clip = `${prefixo}-${id}`;
  return `<svg viewBox="-${margemPeca} -${margemPeca} ${medidaSvg} ${medidaSvg}" preserveAspectRatio="none" aria-hidden="true">
    <defs><clipPath id="${clip}"><polygon points="${pontos}"/></clipPath></defs>
    <image href="${imagem}" x="${-x * tamanhoPeca}" y="${-y * tamanhoPeca}" width="${colunas * tamanhoPeca}" height="${linhas * tamanhoPeca}" preserveAspectRatio="none" clip-path="url(#${clip})"/>
  </svg>`;
}

function jogarPuzzle(indiceNivel, imagem) {
  if (!imagem) {
    const opcoes = imagensPuzzle.filter(opcao => opcao !== ultimaImagemPuzzle);
    imagem = opcoes[Math.floor(Math.random() * opcoes.length)];
  }
  ultimaImagemPuzzle = imagem;
  const nivel = niveisPuzzle[indiceNivel];
  const { colunas, linhas } = nivel;
  const totalPecas = colunas * linhas;
  const ids = Array.from({ length: totalPecas }, (_, i) => i);
  const repetir = () => jogarPuzzle(indiceNivel);
  let selecionada = null;
  let arraste = null;
  let colocadas = 0;
  let finalizacao;
  const ordem = embaralhar([...ids]);
  mostrar(`
    <section class="puzzle" aria-label="${tituloPuzzle}, nível ${nivel.nome}">
      <div class="barra">
        ${voltar}
        <span class="dado dado-icone"><span class="rotulo-progresso">Peças encaixadas</span>${puzzleIcone}<strong id="progresso">0/${totalPecas}</strong></span>
        <button class="secundario botao-icone" id="guia" aria-label="Imagem-guia" aria-pressed="true" title="Ocultar imagem-guia">${malhaIcone}</button>
        ${reiniciar}
      </div>
      <div class="puzzle-layout">
        <section class="painel" aria-labelledby="montagem">
          <h2 id="montagem">Tabuleiro</h2>
          <div class="tabuleiro guia" style="--colunas:${colunas};--linhas:${linhas};--imagem-puzzle:url('${imagem}')">
            ${ids.map(i => `<button class="casa" data-casa="${i}" aria-label="Linha ${Math.floor(i / colunas) + 1}, coluna ${i % colunas + 1}"></button>`).join('')}
          </div>
        </section>
        <section class="painel" aria-labelledby="pecas">
          <h2 id="pecas">Peças embaralhadas</h2>
          <div class="bandeja">
            ${ordem.map((id, i) => `<button class="peca" data-peca="${id}" aria-label="Peça ${i + 1}" aria-pressed="false">${pecaSvg(id, 'bandeja', nivel, imagem)}</button>`).join('')}
          </div>
          <p class="feedback" role="status" id="resultado"></p>
        </section>
      </div>
    </section>
  `, true);
  const tabuleiro = app.querySelector('.tabuleiro');
  const bandeja = app.querySelector('.bandeja');
  const resultado = app.querySelector('#resultado');
  const guia = app.querySelector('#guia');
  const progresso = app.querySelector('#progresso');
  const movimentoReduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function selecionar(botao) {
    selecionada?.setAttribute('aria-pressed', 'false');
    if (botao && botao !== selecionada) tocarSom('escolha');
    selecionada = botao;
    selecionada?.setAttribute('aria-pressed', 'true');
    resultado.textContent = botao ? 'Peça selecionada. Escolha a posição no tabuleiro.' : '';
  }

  function encaixar(casa, origem) {
    if (!selecionada || !casa || casa.disabled) return;
    const id = Number(selecionada.dataset.peca);
    if (id !== Number(casa.dataset.casa)) {
      tocarSom('erro');
      resultado.textContent = 'Essa peça encaixa em outra posição.';
      return;
    }
    const caixaOrigem = origem || selecionada.querySelector('svg').getBoundingClientRect();
    const peca = document.createElement('div');
    peca.className = 'encaixada';
    peca.style.width = `${medidaSvg / colunas}%`;
    peca.style.height = `${medidaSvg / linhas}%`;
    peca.style.left = `${(id % colunas * tamanhoPeca - margemPeca) / colunas}%`;
    peca.style.top = `${(Math.floor(id / colunas) * tamanhoPeca - margemPeca) / linhas}%`;
    peca.innerHTML = pecaSvg(id, 'tabuleiro', nivel, imagem);
    tabuleiro.append(peca);
    casa.disabled = true;
    selecionada.hidden = true;
    selecionar(null);
    // Anima uma cópia fora do tabuleiro para permitir a transição entre os painéis.
    if (!movimentoReduzido) {
      const destino = peca.getBoundingClientRect();
      const copia = document.createElement('div');
      copia.className = 'flutuante';
      copia.innerHTML = pecaSvg(id, 'encaixe', nivel, imagem);
      Object.assign(copia.style, {
        left: `${destino.left}px`, top: `${destino.top}px`,
        width: `${destino.width}px`, height: `${destino.height}px`,
      });
      document.body.append(copia);
      peca.style.visibility = 'hidden';
      const animacao = copia.animate([
        { transformOrigin: 'top left', transform: `translate(${caixaOrigem.left - destino.left}px, ${caixaOrigem.top - destino.top}px) scale(${caixaOrigem.width / destino.width}, ${caixaOrigem.height / destino.height})` },
        { transformOrigin: 'top left', transform: 'none' },
      ], { duration: 240, easing: 'cubic-bezier(.2,.72,.25,1)' });
      animacao.onfinish = () => {
        peca.style.visibility = '';
        copia.remove();
      };
    }
    progresso.textContent = `${++colocadas}/${totalPecas}`;
    tocarSom('acerto');
    resultado.textContent = 'Peça encaixada!';
    const proxima = bandeja.querySelector('.peca:not([hidden])');
    proxima?.focus({ preventScroll: true });
    if (colocadas === totalPecas) {
      finalizacao = setTimeout(() => {
        vitoria('Imagem completa!', `Você encaixou as ${totalPecas} peças do Igaru.`, repetir);
      }, movimentoReduzido ? 0 : 260);
    }
  }

  function casaNaPosicao(evento) {
    return document.elementFromPoint(evento.clientX, evento.clientY)?.closest('.casa:not(:disabled)');
  }

  function moverCopia(evento) {
    const { copia, largura, altura } = arraste;
    copia.style.left = `${evento.clientX - largura / 2}px`;
    copia.style.top = `${evento.clientY - altura / 2}px`;
    arraste.alvo?.classList.remove('alvo');
    arraste.alvo = casaNaPosicao(evento);
    arraste.alvo?.classList.add('alvo');
  }

  bandeja.onpointerdown = (evento) => {
    const botao = evento.target.closest('.peca');
    if (!botao || evento.button !== 0 || arraste) return;
    if (evento.pointerType === 'touch' && matchMedia('(max-width: 620px)').matches) return;
    arraste = { botao, x: evento.clientX, y: evento.clientY, ponteiro: evento.pointerId };
    botao.setPointerCapture(evento.pointerId);
  };
  bandeja.onpointermove = (evento) => {
    if (arraste?.ponteiro !== evento.pointerId) return;
    if (!arraste.copia) {
      if (Math.hypot(evento.clientX - arraste.x, evento.clientY - arraste.y) < 7) return;
      selecionar(arraste.botao);
      const casa = tabuleiro.firstElementChild.getBoundingClientRect();
      const copia = document.createElement('div');
      copia.className = 'flutuante';
      copia.innerHTML = pecaSvg(Number(arraste.botao.dataset.peca), 'arraste', nivel, imagem);
      arraste.largura = casa.width * medidaSvg / tamanhoPeca;
      arraste.altura = casa.height * medidaSvg / tamanhoPeca;
      copia.style.width = `${arraste.largura}px`;
      copia.style.height = `${arraste.altura}px`;
      document.body.append(copia);
      arraste.copia = copia;
    }
    moverCopia(evento);
  };

  function terminarArraste(evento, soltar) {
    if (arraste?.ponteiro !== evento.pointerId) return;
    const anterior = arraste;
    arraste = null;
    anterior.alvo?.classList.remove('alvo');
    if (!anterior.copia) return;
    if (soltar) encaixar(casaNaPosicao(evento), anterior.copia.getBoundingClientRect());
    anterior.copia.remove();
  }

  bandeja.onpointerup = (evento) => terminarArraste(evento, true);
  bandeja.onpointercancel = (evento) => terminarArraste(evento, false);
  bandeja.onclick = (evento) => {
    const botao = evento.target.closest('.peca');
    if (botao && !botao.hidden) selecionar(botao);
  };
  tabuleiro.onclick = (evento) => {
    const casa = evento.target.closest('.casa');
    if (casa && !selecionada) resultado.textContent = 'Escolha uma peça primeiro.';
    encaixar(casa);
  };
  guia.onclick = () => {
    const ativa = tabuleiro.classList.toggle('guia');
    guia.setAttribute('aria-pressed', String(ativa));
    guia.title = ativa ? 'Ocultar imagem-guia' : 'Mostrar imagem-guia';
  };
  app.querySelector('#reiniciar').onclick = () => jogarPuzzle(indiceNivel, imagem);
  limparPartida = () => {
    clearTimeout(finalizacao);
    document.querySelectorAll('.flutuante').forEach(copia => copia.remove());
  };
}

const niveisPalavras = [
  { nome: 'Fácil', colunas: 4, linhas: 4, palavras: 2, vidas: 6 },
  { nome: 'Médio', colunas: 8, linhas: 4, palavras: 3, vidas: 4 },
  { nome: 'Difícil', colunas: 8, linhas: 8, palavras: 5, vidas: 2 },
];
const alfabeto = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const semAcento = texto => texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function escolherNivelPalavras(tipo) {
  const caca = tipo === 'caca';
  mostrar(`
    ${voltar}
    <h1 class="titulo-jogo">${caca ? 'Caça-palavras' : 'Jogo da forca'}</h1>
    <p class="instrucao">Escolha a dificuldade.</p>
    <div class="niveis">${niveisPalavras.map((nivel, i) => `
      <button class="nivel" data-palavras="${tipo}" data-indice="${i}">
        <strong>${nivel.nome}</strong>
        <small>${caca ? `${nivel.colunas * nivel.linhas} letras` : `${nivel.vidas} vidas`}</small>
      </button>
    `).join('')}</div>
  `, true);
}

function criarGradePalavras(nivel) {
  const { colunas, linhas, palavras } = nivel;
  const alvos = embaralhar(perguntas.filter(([resposta]) => resposta.length <= colunas)).slice(0, palavras);
  const grade = Array(colunas * linhas).fill('');
  const indices = grade.map((_, i) => i);
  const direcoes = [[1, 0], [0, 1], [1, 1], [1, -1]];
  if (linhas === 8) direcoes.push([-1, 0], [0, -1], [-1, -1], [-1, 1]);

  for (const [resposta] of alvos) {
    const letras = semAcento(resposta);
    const caminhos = [];
    for (const inicio of indices) for (const [dx, dy] of direcoes) {
      const x = inicio % colunas;
      const y = Math.floor(inicio / colunas);
      const xFim = x + dx * (letras.length - 1);
      const yFim = y + dy * (letras.length - 1);
      if (xFim < 0 || xFim >= colunas || yFim < 0 || yFim >= linhas) continue;
      const caminho = Array.from(letras, (_, i) => inicio + i * (dx + dy * colunas));
      if (caminho.every((pos, i) => !grade[pos] || grade[pos] === letras[i])) caminhos.push(caminho);
    }
    if (!caminhos.length) {
      // A reserva horizontal garante espaço para todas as palavras.
      grade.fill('');
      alvos.forEach(([palavra], i) => {
        const texto = semAcento(palavra);
        const inicio = i * colunas + Math.floor(Math.random() * (colunas - texto.length + 1));
        Array.from(texto).forEach((letra, j) => { grade[inicio + j] = letra; });
      });
      break;
    }
    caminhos[Math.floor(Math.random() * caminhos.length)]
      .forEach((pos, i) => { grade[pos] = letras[i]; });
  }
  return { alvos, grade: grade.map(letra => letra || alfabeto[Math.floor(Math.random() * alfabeto.length)]) };
}

function jogarCaca(indiceNivel) {
  const nivel = niveisPalavras[indiceNivel];
  const { colunas, linhas } = nivel;
  const { alvos, grade } = criarGradePalavras(nivel);
  const encontradas = new Set();
  const repetir = () => jogarCaca(indiceNivel);
  const selecao = [];
  const grafias = alvos.map(([resposta]) => {
    const direta = semAcento(resposta);
    return [direta, [...direta].reverse().join('')];
  });
  let espera;
  mostrar(`
    <section class="jogo-palavras" aria-label="Caça-palavras">
      <div class="barra">${voltar}${reiniciar}</div>
      <p class="instrucao">Toque nas letras vizinhas, uma por vez, para formar cada palavra em linha reta.</p>
      <div class="caca-layout">
        <div class="painel caca-grade" style="--colunas-caca:${colunas};--linhas-caca:${linhas}" aria-label="Grade de letras">
          ${grade.map((letra, i) => `
            <button class="letra" data-celula="${i}" aria-pressed="false" aria-label="${letra}, linha ${Math.floor(i / colunas) + 1}, coluna ${i % colunas + 1}">${letra}</button>
          `).join('')}
        </div>
        <section class="painel" aria-labelledby="palavras-alvo">
          <h2 id="palavras-alvo">Palavras a encontrar</h2>
          <ul class="lista-palavras">${alvos.map(([resposta]) => `
            <li><strong>${resposta}</strong></li>
          `).join('')}</ul>
        </section>
      </div>
      <p class="caca-status" role="status"></p>
    </section>
  `, true);

  const tabuleiro = app.querySelector('.caca-grade');
  const celulas = [...tabuleiro.children];
  const lista = [...app.querySelector('.lista-palavras').children];
  const feedback = app.querySelector('.caca-status');
  app.querySelector('#reiniciar').onclick = repetir;
  limparPartida = () => clearTimeout(espera);

  function limparSelecao() {
    selecao.splice(0).forEach(i => celulas[i].setAttribute('aria-pressed', 'false'));
  }

  function erroDeSelecao(mensagem) {
    limparSelecao();
    tocarSom('erro', .12);
    feedback.textContent = mensagem;
  }

  tabuleiro.onclick = evento => {
    const botao = evento.target.closest('[data-celula]');
    if (!botao || espera || encontradas.size === alvos.length) return;
    const atual = Number(botao.dataset.celula);
    const anterior = selecao.at(-1);
    tocarSom('escolha');

    if (atual === anterior) {
      selecao.pop();
      botao.setAttribute('aria-pressed', 'false');
      feedback.textContent = selecao.length ? 'Selecione a próxima letra.' : '';
      return;
    }

    if (anterior !== undefined) {
      const dx = atual % colunas - anterior % colunas;
      const dy = Math.floor(atual / colunas) - Math.floor(anterior / colunas);
      const mudouDirecao = selecao.length > 1 && atual - anterior !== anterior - selecao.at(-2);
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== 1 || mudouDirecao) {
        erroDeSelecao('Escolha uma letra vizinha e continue em linha reta.');
        return;
      }
    }

    selecao.push(atual);
    botao.setAttribute('aria-pressed', 'true');
    const trecho = selecao.map(i => grade[i]).join('');
    const alvo = grafias.findIndex((opcoes, i) => !encontradas.has(i) && opcoes.includes(trecho));
    if (alvo < 0) {
      const podeContinuar = grafias.some((opcoes, i) =>
        !encontradas.has(i) && opcoes.some(texto => texto.startsWith(trecho)));
      if (podeContinuar) feedback.textContent = 'Selecione a próxima letra.';
      else erroDeSelecao('Essa seleção não forma uma palavra da lista.');
      return;
    }

    const caminho = [...selecao];
    encontradas.add(alvo);
    tocarSom('acerto', .12);
    espera = setTimeout(() => {
      tocarRisco();
      limparSelecao();
      lista[alvo].classList.add('palavra-encontrada');
      lista[alvo].querySelector('strong').setAttribute('aria-label', `${alvos[alvo][0]}, encontrada`);
      caminho.forEach(i => celulas[i].classList.add('letra-encontrada'));
      feedback.textContent = `${alvos[alvo][0]} encontrada!`;
      espera = encontradas.size === alvos.length
        ? setTimeout(() => vitoria('Todas as palavras encontradas!', `Você encontrou as ${alvos.length} palavras.`, repetir), 260)
        : null;
    }, (.12 + sons.acerto.notas.length * sons.acerto.duracao) * 1000);
  };
}

let ultimaPerguntaForca;

function jogarForca(indiceNivel, perguntaAnterior) {
  const nivel = niveisPalavras[indiceNivel];
  const opcoes = perguntas.filter(item => item !== ultimaPerguntaForca);
  const entrada = perguntaAnterior || opcoes[Math.floor(Math.random() * opcoes.length)];
  ultimaPerguntaForca = entrada;
  const [resposta, pergunta] = entrada;
  const letras = [...semAcento(resposta)];
  const escolhidas = new Set();
  let vidas = nivel.vidas;
  let espera;
  mostrar(`
    <section class="jogo-palavras forca" aria-label="Jogo da forca">
      <div class="barra">${voltar}${reiniciar}<span class="dado"><strong id="vidas">${vidas}</strong> vidas</span></div>
      <section class="painel forca-desafio" aria-labelledby="dica-forca">
        <h2 id="dica-forca">${pergunta}</h2>
        <svg class="forca-desenho" viewBox="0 0 120 110" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
          <path d="M8 103h68M20 103V8h65v14"/>
          <circle data-parte cx="85" cy="34" r="11"/>
          <path data-parte d="M85 45v28"/>
          <path data-parte d="m85 51-17 13"/>
          <path data-parte d="m85 51 17 13"/>
          <path data-parte d="m85 73-15 19"/>
          <path data-parte d="m85 73 15 19"/>
        </svg>
        <div class="forca-resposta" aria-label="Palavra de ${letras.length} letras">
          ${letras.map(() => '<span aria-hidden="true"> </span>').join('')}
        </div>
      </section>
      <section class="painel" aria-labelledby="teclado-forca">
        <h2 id="teclado-forca">Escolha uma letra</h2>
        <div class="forca-teclado">
          ${[...alfabeto].map(letra => `<button class="letra" data-letra="${letra}">${letra}</button>`).join('')}
        </div>
      </section>
      <section class="painel" aria-labelledby="escolhidas-forca">
        <h2 id="escolhidas-forca">Letras já escolhidas</h2>
        <ul class="forca-escolhidas" aria-live="polite"></ul>
      </section>
      <p class="feedback" role="status"></p>
    </section>
  `, true);
  const teclado = app.querySelector('.forca-teclado');
  const usadas = app.querySelector('.forca-escolhidas');
  const palavra = app.querySelector('.forca-resposta');
  const contador = app.querySelector('#vidas');
  const desenho = app.querySelectorAll('[data-parte]');
  const feedback = app.querySelector('.feedback');
  app.querySelector('#reiniciar').onclick = () => jogarForca(indiceNivel, entrada);
  limparPartida = () => clearTimeout(espera);

  teclado.onclick = evento => {
    const botao = evento.target.closest('[data-letra]');
    if (!botao || espera) return;
    const letra = botao.dataset.letra;
    escolhidas.add(letra);
    const proximo = botao.nextElementSibling || botao.previousElementSibling;
    botao.remove();
    const acerto = letras.includes(letra);
    tocarSom(acerto ? 'acerto' : 'erro');
    usadas.insertAdjacentHTML('beforeend', `<li class="${acerto ? 'letra-encontrada' : ''}">${letra}</li>`);
    if (!acerto) {
      contador.textContent = --vidas;
      const partesVisiveis = desenho.length * (nivel.vidas - vidas) / nivel.vidas;
      desenho.forEach((parte, i) => parte.classList.toggle('visivel', i < partesVisiveis));
    }
    const reveladas = letras.map((valor, i) => escolhidas.has(valor) ? resposta[i] : '');
    reveladas.forEach((valor, i) => { palavra.children[i].textContent = valor || ' '; });
    palavra.setAttribute('aria-label', reveladas.map(valor => valor || 'letra oculta').join(', '));
    const venceu = reveladas.every(Boolean);
    feedback.textContent = acerto ? 'Letra encontrada!' : 'Essa letra não faz parte da palavra.';
    if (venceu || !vidas) {
      espera = setTimeout(() => vitoria(
        venceu ? 'Palavra descoberta!' : 'Acabaram as vidas',
        `A resposta era <strong>${resposta}</strong>.`,
        () => jogarForca(indiceNivel),
        venceu,
      ), 240);
    } else {
      proximo?.focus({ preventScroll: true });
    }
  };
}

// Tons sintetizados para funcionar também no HTML offline da exposição.
const sons = {
  foco: { notas: [520], duracao: .045, volume: .025 },
  escolha: { notas: [370, 555], duracao: .06, volume: .07 },
  acerto: { notas: [660, 880], duracao: .1, volume: .09 },
  erro: { notas: [294, 196], duracao: .11, volume: .08 },
  vitoria: { notas: [523, 659, 784, 1047], duracao: .17, volume: .10 },

let audio;

// O Safari pode exigir que a retomada do áudio aconteça dentro do toque.
document.addEventListener('click', (evento) => {
  if (!evento.target.closest('button') || audio?.state === 'running') return;
  const Contexto = window.AudioContext || window.webkitAudioContext;
  if (!Contexto) return;

  try {
    const sessao = navigator.audioSession;
    if (sessao && sessao.type !== 'playback') sessao.type = 'playback';
  } catch {
    // A sessão de mídia é opcional.
  }

  try {
    if (!audio || audio.state === 'closed') audio = new Contexto();
    if (audio.state !== 'running') audio.resume().catch(() => {});
  } catch {
    // O jogo continua disponível caso o navegador bloqueie o áudio.
  }
}, { capture: true });

async function tocarSom(efeito, atraso = 0) {
  if (!audio || (efeito === 'foco' && audio.state !== 'running')) return;
  try {
    if (audio.state !== 'running') await audio.resume();
    const { notas, duracao, volume } = sons[efeito];
    const inicio = audio.currentTime + atraso + (efeito === 'vitoria' ? .18 : 0);
    notas.forEach((frequencia, i) => {
      const tempo = inicio + i * duracao;
      const tom = audio.createOscillator();
      const ganho = audio.createGain();
      tom.type = efeito === 'erro' ? 'triangle' : 'sine';
      tom.frequency.value = frequencia;
      ganho.gain.setValueAtTime(.001, tempo);
      ganho.gain.exponentialRampToValueAtTime(volume, tempo + .01);
      ganho.gain.exponentialRampToValueAtTime(.001, tempo + duracao);
      tom.connect(ganho).connect(audio.destination);
      tom.start(tempo);
      tom.stop(tempo + duracao);
    });
  } catch {
    // A indisponibilidade de áudio não deve interromper a partida.
  }
}

function tocarRisco() {
  if (audio?.state !== 'running') return;
  try {
    const duracao = .23;
    const ruido = audio.createBuffer(1, Math.ceil(audio.sampleRate * duracao), audio.sampleRate);
    const dados = ruido.getChannelData(0);
    for (let i = 0; i < dados.length; i++) {
      const atrito = .4 + .6 * Math.abs(Math.sin(i / audio.sampleRate * 130));
      dados[i] = (Math.random() * 2 - 1) * atrito;
    }
    const fonte = audio.createBufferSource();
    fonte.buffer = ruido;
    const filtro = audio.createBiquadFilter();
    filtro.type = 'bandpass';
    filtro.frequency.value = 1850;
    const volume = audio.createGain();
    const tempo = audio.currentTime;
    volume.gain.setValueAtTime(.001, tempo);
    volume.gain.linearRampToValueAtTime(.20, tempo + .02);
    volume.gain.exponentialRampToValueAtTime(.001, tempo + duracao);
    fonte.connect(filtro).connect(volume).connect(audio.destination);
    fonte.start();
  } catch {
    // O risco visual continua disponível sem áudio.
  }
}

app.addEventListener('pointerover', (evento) => {
  const item = evento.target.closest('.carta:not(.virada), .peca:not([hidden])');
  if (evento.pointerType === 'mouse' && item && !item.contains(evento.relatedTarget)) {
    tocarSom('foco');
  }
});

async function alternarTelaCheia(mostrarAviso = false) {
  tentouTelaCheia = true;
  if (!document.fullscreenEnabled) return;
  const aviso = app.querySelector('#aviso-tela-cheia');
  if (aviso) aviso.hidden = true;
  try {
    if (document.fullscreenElement) {
      if (mostrarAviso) await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch {
    if (mostrarAviso && aviso) {
      aviso.textContent = 'O navegador não conseguiu mudar o modo de tela cheia.';
      aviso.hidden = false;
    }
  }
}

document.addEventListener('fullscreenchange', () => {
  const botao = app.querySelector('[data-acao="tela-cheia"]');
  if (botao) botao.textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
});

document.addEventListener('click', (evento) => {
  const botao = evento.target.closest('button');
  if (!botao) return;
  const acao = botao.dataset.acao;
  if (acao === 'tela-cheia') {
    alternarTelaCheia(true);
    return;
  }
  const escolhaInicial = botao.classList.contains('opcao');
  if (escolhaInicial && !tentouTelaCheia && /^https?:$/.test(location.protocol)) {
    alternarTelaCheia();
  }
  const acoes = {
    menu,
    niveis: () => escolherNivel(),
    puzzle: () => escolherNivel(true),
    caca: () => escolherNivelPalavras('caca'),
    forca: () => escolherNivelPalavras('forca'),
  };
  acoes[botao.dataset.acao]?.();
  if ('palavras' in botao.dataset) {
    const indice = Number(botao.dataset.indice);
    tocarSom('escolha');
    if (botao.dataset.palavras === 'caca') jogarCaca(indice);
    else jogarForca(indice);
  }
  if ('nivel' in botao.dataset || 'puzzle' in botao.dataset) {
    tocarSom('escolha');
    if ('puzzle' in botao.dataset) jogarPuzzle(Number(botao.dataset.puzzle));
    else jogarMemoria(Number(botao.dataset.nivel));
  }
});

menu();
  </script>
